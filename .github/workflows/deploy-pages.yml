name: Deploy to GitHub Pages
run-name: "Orbit / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# Jobs receive only the permissions they use. No browser token or write-back commits.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Sync → Check → Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up artwork runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-visuals.txt

      - name: Install vector tooling
        run: python -m pip install -r scripts/requirements-visuals.txt

      - name: Sync public activity and workflow snapshots
        if: github.event_name != 'pull_request'
        run: npm run update:recent-work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate orbital README and social artwork
        run: npm run build:visuals

      - name: Svelte and TypeScript checks
        run: npm run check

      - name: Motion and GitHub integration tests
        run: npm run test:unit

      - name: Build static site
        run: npm run build

      - name: Write mission summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Orbit / mission complete
          - ✓ Maple Mono vector artwork and static social cover
          - ✓ Svelte / TypeScript validation
          - ✓ Motion, activity and workflow status tests
          - ✓ Static GitHub Pages build

          The website polls public GitHub APIs only while telemetry is visible.
          README telemetry is a timestamped snapshot, not a streaming API.
          SUMMARY

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    name: Deploy → Orbit
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
